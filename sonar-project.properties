# SonarQube Cloud Free: proyecto STGlobal ACS vinculado a GitHub Actions.
# SonarQube Free ejecuta el análisis sobre main; SONAR_TOKEN va en GitHub Secrets.
# La CI espera el Quality Gate y falla si no se cumple.
sonar.projectKey=stglobal-acs-web
sonar.organization=stglobal-acs
sonar.projectName=STGlobal Web ACS 2026
sonar.sources=backend,frontend/client
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.*,**/*.test.*,**/tests/**,**/package-lock.json
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
